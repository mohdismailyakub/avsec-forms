const getHari = dateString => {
  if (!dateString) return "";
  const days = ["Ahad", "Isnin", "Selasa", "Rabu", "Khamis", "Jumaat", "Sabtu"];
  const date = new Date(dateString);
  return days[date.getDay()];
};
const generateTimeSlots = startHour => {
  const slots = [];
  for (let i = 0; i < 12; i++) {
    const currentHour = (startHour + i) % 24;
    const nextHour = (startHour + i + 1) % 24;
    const format = h => h.toString().padStart(2, '0') + '00';
    slots.push({
      id: `${format(currentHour)}-${format(nextHour)}`,
      label: `${format(currentHour)}H - ${format(nextHour)}H`
    });
  }
  return slots;
};
const getTimeSlots = (lokasi, syif) => {
  let startHour = syif.includes('Pagi') ? 7 : 19;
  return generateTimeSlots(startHour);
};
